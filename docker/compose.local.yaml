# Testing the stack on a PC (Docker Desktop has no host networking like a
# VPS): the server's ports published, the keeper and the minter in the
# server's network.
#   docker compose -f compose.yaml -f compose.local.yaml up -d --build
services:
  server:
    network_mode: bridge
    ports:
      - "${SFVR_PORT:-5555}:${SFVR_PORT:-5555}/tcp"
      - "47200-47299:47200-47299/udp"
  ice:
    network_mode: "service:server"
  geoip:
    network_mode: "service:server"
  keeper:
    network_mode: "service:server"
  reports:
    network_mode: bridge
    ports:
      - "${REPORTS_PORT:-5580}:${REPORTS_PORT:-5580}/tcp"
