apiVersion: 1
providers:
  # monitoring/dashboards/*.json (make-dashboards.py writes them).
  # The provider keeps its name (Grafana files the dashboards under it).
  - name: sfvr
    folder: Polarity
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
