# The Docker API for container-stats and alloy (compose.monitoring.yaml),
# through HAProxy in tecnativa/docker-socket-proxy: reads of the container
# list, each container's details, stats and log, and the network list
# (Alloy's discovery). Every other call is refused, so neither can start
# containers or read files out of them. It listens on a socket in the
# docker-api volume, with no network.
global
    log stdout format raw daemon info
    uid 0  # root, for Docker's socket
    maxconn 200

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout connect 10s
    timeout client 1h
    timeout server 30s
    timeout http-keep-alive 10s

backend docker
    server socket /var/run/docker.sock

# Logs are followed: the answer stays open.
backend docker-logs
    timeout server 1h
    server socket /var/run/docker.sock

frontend api
    bind /sock/docker.sock mode 600
    acl reads method GET HEAD
    acl about path,url_dec -m reg ^(/v[0-9.]+)?/(_ping|version)$
    acl containers path,url_dec -m reg ^(/v[0-9.]+)?/containers/json$
    acl details path,url_dec -m reg ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/(json|stats)$
    acl logs path,url_dec -m reg ^(/v[0-9.]+)?/containers/[A-Za-z0-9_.-]+/logs$
    acl networks path,url_dec -m reg ^(/v[0-9.]+)?/networks$
    http-request deny unless reads
    http-request deny unless about || containers || details || logs || networks
    use_backend docker-logs if logs
    default_backend docker
