# SFVR's custom rooms server on one VPS (docs/rooms-vps-docker.md):
#   server  the rooms server (Weyvelength), TCP ${SFVR_PORT} (5555)
#   ice     Cloudflare TURN credentials for it, every 6 hours
#   geoip   DB-IP's free IP-to-country database for it, every month (members'
#           countries on the public room lists; IP Geolocation by DB-IP)
#   keeper  sfvr-keeper, the tables and moderation, a client of the server;
#           its peer-to-peer links use UDP ${KEEPER_PORTS}
#   reports sfvr-reports, the games' desync and crash reports, TCP
#           ${REPORTS_PORT} (5580), into the host's /var/lib/sfvr-server
# Run from this folder: docker compose up -d --build
#
# Host networking: Docker's published ports go around ufw, which holds the
# per-address connection limit (connection-limit.sh) and the TCP 443
# redirect (port-443.sh); and the keeper's links need the VPS's own address
# for their ICE candidates. Each container still has its own user, files
# and no capabilities.
name: sfvr-rooms

x-hardened: &hardened
  network_mode: host
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

services:
  server:
    <<: *hardened
    build: {context: .., dockerfile: docker/server.Dockerfile}
    image: sfvr-rooms/server:latest
    environment:
      SFVR_PORT: ${SFVR_PORT:-5555}
      # A country for LAN addresses: testing the stack on a PC only.
      GEOIP_PRIVATE: ${GEOIP_PRIVATE:-}
    volumes: ["ice:/data", "geoip:/geoip:ro", "stats:/stats"]
    ulimits:
      nofile: {soft: 65536, hard: 65536}

  ice:
    <<: *hardened
    image: sfvr-rooms/server:latest
    entrypoint: ["/usr/local/bin/ice-loop.sh"]
    # CF_TURN_KEY_ID, CF_TURN_API_TOKEN (cloudflare.env.example).
    env_file: [cloudflare.env]
    volumes: ["ice:/data"]
    depends_on: [server]

  geoip:
    <<: *hardened
    image: sfvr-rooms/server:latest
    entrypoint: ["/usr/local/bin/geoip-loop.sh"]
    volumes: ["geoip:/geoip"]
    depends_on: [server]

  keeper:
    <<: *hardened
    build: {context: .., dockerfile: docker/keeper.Dockerfile}
    image: sfvr-rooms/keeper:latest
    command:
      - --key
      - /run/secrets/keeper_key
      - --state
      - /data/state
      - --words
      - /config/keeper-words.txt
      - --server
      - 127.0.0.1:${SFVR_PORT:-5555}
      - --ports
      - ${KEEPER_PORTS:-47200-47299}
      # Every 5 s (compose.monitoring.yaml reads them): its metrics for
      # node_exporter's textfile collector, and the public room list for the
      # rooms publisher.
      - --metrics
      - /data/keeper.prom
      - --status
      - /data/status.json
      # The server's connection count (players online, browsing included).
      - --server-stats
      - /stats/server.json
    secrets: [keeper_key]
    volumes:
      - "keeper:/data"
      - "stats:/stats:ro"
      - "./keeper-words.txt:/config/keeper-words.txt:ro"
    depends_on: [server]

  reports:
    <<: *hardened
    build: {context: .., dockerfile: docker/reports.Dockerfile}
    image: sfvr-rooms/reports:latest
    environment:
      SFVR_REPORTS_PORT: ${REPORTS_PORT:-5580}
      SFVR_REPORTS_MAX_MB: ${REPORTS_MAX_MB:-4096}
      SFVR_CRASHES_MAX_MB: ${CRASHES_MAX_MB:-1024}
    command: [--per-hour, "${REPORTS_PER_HOUR:-120}"]
    # The host's folders (owned by uid 10001, rooms-vps-docker.md step 6):
    # read, copied and bundled there, as before the stack.
    volumes:
      - "/var/lib/sfvr-server/reports:/reports"
      - "/var/lib/sfvr-server/crashes:/crashes"
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/v1/health' % os.environ['SFVR_REPORTS_PORT'], timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

secrets:
  # Made once with: docker compose run --rm --no-deps -v ./secrets:/out keeper --new-key /out/keeper.key
  keeper_key: {file: ./secrets/keeper.key}

volumes:
  ice: {}
  keeper: {}
  geoip: {}
  stats: {}
