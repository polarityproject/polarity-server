# The Polarity rooms API Worker (src/worker.js). Deploy from this folder:
#   npx wrangler r2 bucket create polarity-rooms
#   npx wrangler secret put PUSH_SECRET      (the VPS's secrets/rooms_push)
#   npx wrangler deploy
# docs/rooms-vps-docker.md, "Rooms API", has the whole setup.
name = "polarity-rooms-api"
main = "src/worker.js"
compatibility_date = "2024-11-01"
# Served at api.polaritymod.link (the polaritymod.link zone must be in the
# same Cloudflare account; deploy makes the DNS record and certificate). The
# workers.dev address stays on beside it, for the site's fallback.
routes = [{ pattern = "api.polaritymod.link", custom_domain = true }]
workers_dev = true

[[r2_buckets]]
binding = "ROOMS"
bucket_name = "polarity-rooms"

[observability]
enabled = true
